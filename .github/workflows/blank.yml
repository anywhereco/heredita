name: Mirror (filtered) → public

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: 
      name: Default
    permissions:
      contents: read

    steps:
    - name: Checkout full repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python (for git-filter-repo)
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install git-filter-repo
      run: python -m pip install --upgrade git-filter-repo

    - name: Create bare mirror clone
      run: |
        set -euo pipefail
        rm -rf repo-mirror.git
        # clone --mirror from local checkout (faster than re-authenticating)
        git clone --mirror . repo-mirror.git
        ls -la repo-mirror.git

    - name: Remove server/ from history
      run: |
        set -euo pipefail
        cd repo-mirror.git
        # Remove the server directory from all commits
        git filter-repo --invert-paths --path server --path server/ --force

    - name: Push filtered mirror to public repo
      env:
        PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
        PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        set -euo pipefail
        cd repo-mirror.git
        # configure remote using PAT (keeps secret out of logs)
        git remote add public "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPO}.git"
        # push --mirror (replaces refs on public)
        git push --mirror public
